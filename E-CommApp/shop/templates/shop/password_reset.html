{% extends "shop/base.html" %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
<h1 class="h4 mb-3">Forgot password</h1>
<!-- VULNERABILITY #20/#21: the reset token is a predictable 6-digit number
     with no expiry, and is displayed directly here (simulating an email)
     using a Host-derived link that trusts the incoming Host header. -->
<div class="tool-card">
  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label">Username</label>
      <input class="form-control" name="username">
    </div>
    <button class="btn-buy" style="max-width:220px" type="submit">Send reset token</button>
  </form>
  {% if note %}<div class="alert alert-info mt-3 mb-0">{{ note }}</div>{% endif %}
  {% if token %}<div class="alert alert-warning mt-2 mb-0">Your reset token: <strong>{{ token }}</strong></div>{% endif %}
  <p class="mt-3 mb-0"><a href="{% url 'password_reset_confirm' %}">Already have a token?</a></p>
</div>
{% endblock %}
