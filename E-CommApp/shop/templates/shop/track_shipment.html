{% extends "shop/base.html" %}
{% block title %}Track Shipment{% endblock %}
{% block content %}
<h1 class="h4 mb-3">Track shipment</h1>
<!-- VULNERABILITY #15: OS command injection via shell=True string
     concatenation in shop/views.py track_shipment(). Try host:
     127.0.0.1 & whoami -->
<div class="tool-card">
  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label">Carrier host/IP</label>
      <input class="form-control" name="host" value="127.0.0.1">
    </div>
    <button class="btn-buy" style="max-width:200px" type="submit">Ping</button>
  </form>
  {% if output %}<pre class="mt-3 bg-dark text-light p-3 rounded">{{ output }}</pre>{% endif %}
</div>
{% endblock %}
