{% extends "shop/base.html" %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<h1 class="h4 mb-3">Reset password</h1>
<!-- VULNERABILITY #20: no rate limiting on token attempts here, and the
     token space is only 6 digits (000000-999999). -->
<div class="tool-card">
  {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
  {% if success %}<div class="alert alert-success">{{ success }}</div>{% endif %}
  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label">Username</label>
      <input class="form-control" name="username">
    </div>
    <div class="mb-3">
      <label class="form-label">Reset token</label>
      <input class="form-control" name="token">
    </div>
    <div class="mb-3">
      <label class="form-label">New password</label>
      <input class="form-control" type="password" name="new_password">
    </div>
    <button class="btn-buy" style="max-width:220px" type="submit">Reset password</button>
  </form>
</div>
{% endblock %}
