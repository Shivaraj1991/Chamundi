name: Django CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: ./E-CommApp
        run: |
          python -m pip install --upgrade pip
        

      - name: Django check
        working-directory: ./E-CommApp
        run: |
          python manage.py check

      - name: Run migrations
        working-directory: ./E-CommApp
        run: |
          python manage.py migrate

      - name: Run tests
        working-directory: ./E-CommApp
        run: |
          python manage.py test
